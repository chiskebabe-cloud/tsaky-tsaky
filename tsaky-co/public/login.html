<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Connexion administrateur — TSAKY & CO</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#20242b,#343a43);font-family:Segoe UI,Arial,sans-serif;color:#20242b}.card{width:min(100%,410px);background:#fff;border-radius:20px;padding:32px;box-shadow:0 18px 60px #0003}.brand{font-size:25px;font-weight:900;text-align:center;margin-bottom:8px}.brand span{color:#f47b20}.sub{text-align:center;color:#737b86;margin:0 0 26px}label{display:block;font-weight:700;font-size:14px;margin-bottom:8px}input{width:100%;padding:13px;border:1px solid #dfe3e8;border-radius:10px;font:inherit}button{width:100%;margin-top:16px;padding:13px;border:0;border-radius:10px;background:#f47b20;color:white;font:inherit;font-weight:800;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.error{min-height:20px;margin-top:13px;color:#c83c3c;font-size:13px}.hint{text-align:center;color:#737b86;font-size:12px;line-height:1.5;margin-top:20px}.home{display:block;text-align:center;color:#737b86;font-size:13px;margin-top:18px;text-decoration:none}
</style></head><body><main class="card"><div class="brand">TSAKY <span>& CO</span></div><p class="sub">Connexion à l’espace administrateur</p><form id="loginForm"><label for="password">Mot de passe administrateur</label><input id="password" name="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">Se connecter</button><div id="error" class="error" role="alert"></div></form><div class="hint">La session administrateur expire après 8 heures. Pour modifier le mot de passe, définissez la variable d’environnement ADMIN_PASSWORD avant de démarrer le serveur.</div><a class="home" href="/">← Retour à la prise de commande</a></main><script>
document.getElementById('loginForm').addEventListener('submit',async e=>{e.preventDefault();const btn=document.getElementById('submit'),err=document.getElementById('error');btn.disabled=true;err.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.getElementById('password').value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Connexion impossible.');location.href=data.redirect||'/dashboard';}catch(ex){err.textContent=ex.message||'Connexion impossible.';}finally{btn.disabled=false;}});
</script></body></html>
