<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>TSAKY & CO — Commandes</title>
<style>
:root{--orange:#f47b20;--ink:#20242b;--muted:#747b84;--bg:#f5f6f8;--green:#16845b}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#20242b;color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;z-index:5}
.brand{font-weight:900;font-size:22px;letter-spacing:.5px}.brand span{color:var(--orange)}header small{color:#d4d7db}
main{max-width:1450px;margin:auto;padding:22px;display:grid;grid-template-columns:minmax(0,1fr) 350px;gap:22px}
h1{margin:0 0 6px;font-size:26px} .sub{color:var(--muted);margin:0 0 18px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 18px}.filters button,.kind button{border:1px solid #ddd;background:#fff;border-radius:22px;padding:9px 14px;cursor:pointer;font-weight:700}.filters button.active,.kind button.active{background:var(--orange);border-color:var(--orange);color:white}
.products{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.product{background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 3px 14px #20242b0b;border:2px solid transparent;cursor:pointer;transition:.15s;position:relative}.product:hover{transform:translateY(-2px);box-shadow:0 8px 22px #20242b16}.product.selected{border-color:var(--orange)}
.product img{width:100%;height:145px;object-fit:cover;display:block;background:#eee}.pbody{padding:12px}.pname{font-weight:800;font-size:15px;min-height:36px}.price{font-weight:900;color:var(--orange);margin-top:7px}.tap{font-size:12px;color:var(--muted);margin-top:7px}
.badge{position:absolute;top:9px;left:9px;background:#20242bcc;color:white;padding:5px 8px;border-radius:8px;font-size:11px}
.cart{background:#fff;border-radius:18px;padding:18px;box-shadow:0 3px 14px #20242b0b;align-self:start;position:sticky;top:84px}.cart h2{margin:0 0 14px;font-size:20px}.empty{color:var(--muted);padding:22px 0;text-align:center}
.cartitem{padding:12px 0;border-bottom:1px solid #eee}.carttop{display:flex;justify-content:space-between;gap:8px;font-weight:700}.carttop button{border:0;background:none;color:#c33;cursor:pointer;font-size:18px}.qty{display:flex;align-items:center;gap:10px;margin-top:8px}.qty button{width:28px;height:28px;border:1px solid #ddd;border-radius:8px;background:white;cursor:pointer;font-size:17px}.qty span{min-width:18px;text-align:center;font-weight:800}.note{width:100%;margin-top:8px;border:1px solid #ddd;border-radius:8px;padding:8px}
label{display:block;font-size:12px;font-weight:800;color:#555;margin:13px 0 6px}select,input{width:100%;padding:10px;border:1px solid #ddd;border-radius:9px;background:#fff}
.kind{display:flex;gap:6px}.kind button{flex:1;padding:8px 5px;font-size:12px}
.totalrow{display:flex;justify-content:space-between;align-items:center;margin-top:16px;font-size:16px}.total{font-size:26px;font-weight:950;color:var(--orange)}
.primary{width:100%;background:var(--orange);color:white;border:0;border-radius:11px;padding:13px;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{width:100%;background:#fff;color:#333;border:1px solid #ddd;border-radius:11px;padding:11px;font-weight:800;margin-top:8px;cursor:pointer}
#notice{margin-top:10px;font-size:13px;color:var(--green);font-weight:700}.menu-section{display:flex;align-items:end;justify-content:space-between;gap:12px}.menu-section .count{font-size:13px;color:var(--muted)}
@media(max-width:1000px){main{grid-template-columns:1fr}.cart{position:static}.products{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:620px){header{padding:13px 15px}.brand{font-size:19px}main{padding:14px;gap:16px}.products{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.product img{height:120px}.pbody{padding:10px}.pname{font-size:14px}.cart{padding:15px}}
</style></head>
<body>
<header><div class="brand">TSAKY <span>& CO</span></div><small>Menu • Commande • Encaissement</small></header>
<main>
<section>
 <h1>Composez votre commande</h1><p class="sub">Touchez une photo pour ajouter le produit. Le total se calcule automatiquement.</p>
 <div class="menu-section"><strong>Notre menu</strong><span class="count" id="productCount"></span></div>
 <div class="filters" id="filters"></div><div class="products" id="products"></div>
</section>
<aside class="cart">
 <h2>🧾 Votre commande</h2><div id="cartItems"></div>
 <label>Type de commande</label><div class="kind" id="kinds"><button class="active" data-kind="Sur place">Sur place</button><button data-kind="À emporter">À emporter</button><button data-kind="Livraison">Livraison</button></div>
 <div id="tableWrap"><label>Numéro de table</label><input id="tableNo" placeholder="Ex. 4"></div>
 <label>Nom du client (facultatif)</label><input id="customer" placeholder="Nom du client">
 <label>Mode de paiement</label><select id="payment"><option>Espèces</option><option>MVola</option><option>Orange Money</option><option>Airtel Money</option><option>Autre</option></select>
 <div class="totalrow"><span>Total à payer</span><span class="total" id="total">0 Ar</span></div>
 <div class="totalrow" style="font-size:13px;color:#747b84"><span>Articles</span><span id="itemsCount">0</span></div>
 <button class="primary" id="sendOrder" disabled>Valider la commande</button><button class="secondary" id="print">Imprimer le ticket</button>
 <div id="notice" role="status"></div>
</aside>
</main>
<script>
let productsData = [];
const money=n=>new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0}).format(n)+' Ar';
let cart={}, category="Tous", kind="Sur place";
let categories=["Tous"];
function renderFilters(){categories=["Tous",...new Set(productsData.map(p=>p.category))];if(!categories.includes(category))category='Tous';document.getElementById('filters').innerHTML=categories.map(c=>`<button class="${category===c?'active':''}" data-cat="${c}">${c}</button>`).join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{category=b.dataset.cat;renderFilters();renderProducts()})}
function renderProducts(){let arr=productsData.filter(p=>category==="Tous"||p.category===category);document.getElementById('productCount').textContent=arr.length+' produits';document.getElementById('products').innerHTML=arr.map(p=>`<article class="product ${cart[p.id]?'selected':''}" data-add="${p.id}" tabindex="0" role="button" aria-label="Ajouter ${p.name}"><span class="badge">${p.category}</span><img src="${p.img||''}" alt="${p.name}" loading="lazy" onerror="this.style.visibility='hidden'"><div class="pbody"><div class="pname">${p.name}</div><div class="price">${money(p.price)}</div><div class="tap">＋ Cliquer pour ajouter</div></div></article>`).join('');document.querySelectorAll('[data-add]').forEach(el=>{const add=()=>{let id=+el.dataset.add;cart[id]=(cart[id]||0)+1;renderProducts();renderCart()};el.onclick=add;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();add()}}})}
function renderCart(){let entries=Object.entries(cart).filter(([id,q])=>q>0);let total=entries.reduce((s,[id,q])=>s+productsData.find(p=>p.id==id).price*q,0);let count=entries.reduce((s,[id,q])=>s+q,0);document.getElementById('cartItems').innerHTML=entries.length?entries.map(([id,q])=>{let p=productsData.find(x=>x.id==id);return `<div class="cartitem"><div class="carttop"><span>${p.name}</span><button title="Retirer" data-remove="${id}">×</button></div><div style="color:#747b84;font-size:13px;margin-top:4px">${money(p.price)} × ${q} = <b>${money(p.price*q)}</b></div><div class="qty"><button data-minus="${id}">−</button><span>${q}</span><button data-plus="${id}">+</button></div><input class="note" data-note="${id}" placeholder="Note : sans piment, bien cuit…"></div>`}).join(''):'<div class="empty">Cliquez sur les photos du menu pour commencer.</div>';
document.getElementById('total').textContent=money(total);document.getElementById('itemsCount').textContent=count;document.getElementById('sendOrder').disabled=!count;
document.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{cart[b.dataset.plus]++;renderCart();renderProducts()});document.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{let id=b.dataset.minus;cart[id]--;if(cart[id]<=0)delete cart[id];renderCart();renderProducts()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];renderCart();renderProducts()})}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.classList.toggle('active',x===b));document.getElementById('tableWrap').style.display=kind==='Sur place'?'block':'none'});
function orderData(){let entries=Object.entries(cart).map(([id,q])=>({id:Number(id),product:productsData.find(p=>p.id==id).name,price:productsData.find(p=>p.id==id).price,quantity:q,note:document.querySelector(`[data-note="${id}"]`)?.value||''}));return {customer:document.getElementById('customer').value,kind,table:document.getElementById('tableNo').value,payment:document.getElementById('payment').value,items:entries,total:entries.reduce((s,x)=>s+x.price*x.quantity,0)}}
document.getElementById('sendOrder').onclick=async()=>{const button=document.getElementById('sendOrder');const order=orderData();if(!order.items.length){document.getElementById('notice').textContent='Ajoutez au moins un article.';return}button.disabled=true;button.textContent='Enregistrement…';try{const response=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(order)});const result=await response.json();if(!response.ok)throw new Error(result.error||'Erreur lors de l’enregistrement.');document.getElementById('notice').textContent='Commande '+result.orderId+' validée et enregistrée. La page va se rafraîchir…';cart={};setTimeout(()=>window.location.reload(),2000)}catch(e){console.error(e);document.getElementById('notice').textContent='Commande non enregistrée : '+(e.message||'vérifiez que le serveur est démarré.');button.disabled=false;button.textContent='Valider la commande'}};
document.getElementById('print').onclick=()=>{let o=orderData();let w=window.open('','_blank','width=420,height=650');if(!w)return;w.document.write(`<html><head><title>Ticket TSAKY & CO</title><style>body{font:14px Arial;padding:20px}h2{text-align:center}hr{border:0;border-top:1px dashed #555}.r{display:flex;justify-content:space-between;margin:8px 0}</style></head><body><h2>TSAKY & CO</h2><p>Type : ${o.kind} ${o.table?'• Table '+o.table:''}</p><p>Client : ${o.customer||'—'}</p><hr>${o.items.map(i=>`<div class="r"><span>${i.quantity} × ${i.product}</span><b>${money(i.price*i.quantity)}</b></div>${i.note?'<small>'+i.note+'</small>':''}`).join('')}<hr><div class="r"><b>TOTAL À PAYER</b><b>${money(o.total)}</b></div><p>Paiement : ${o.payment}</p><p style="text-align:center">Merci et à bientôt !</p><script>window.onload=()=>window.print()<\/script></body></html>`);w.document.close()};
async function initMenu(){try{const r=await fetch('/api/products',{cache:'no-store'});const data=await r.json();if(!r.ok)throw new Error(data.error||'Menu indisponible');productsData=data;if(!productsData.length)document.getElementById('products').innerHTML='<div class="empty">Aucun produit disponible pour le moment.</div>';renderFilters();renderProducts();renderCart()}catch(e){document.getElementById('products').innerHTML='<div class="empty">Impossible de charger le menu. Vérifiez le serveur.</div>';document.getElementById('notice').textContent=e.message}}
initMenu();
</script></body></html>
